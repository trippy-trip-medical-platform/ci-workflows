name: Docker Build & Push

on:
  workflow_call:
    inputs:
      image-name:
        type: string
        required: true
        description: 'Docker image name (e.g. medical-lookups)'

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Bound GHCR storage: every build leaves a permanent :<sha> image, so prune
      # to the 5 most recent versions. Never blocks the build (best-effort).
      - name: Prune old image versions (keep latest 5)
        continue-on-error: true
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ inputs.image-name }}
          package-type: container
          min-versions-to-keep: 5
