name: Deploy to EC2

# Reusable workflow: pull the freshly-pushed image for a single service and
# recreate just that container on the EC2 host. Intended to run AFTER the
# docker-build workflow has pushed :latest to GHCR.
#
# Caller wires it up with:
#   deploy:
#     needs: docker
#     uses: trippy-trip-medical-platform/ci-workflows/.github/workflows/deploy-ec2.yml@main
#     with:
#       service: medical-user-management
#     secrets: inherit
#
# Required org/repo secrets (forwarded via `secrets: inherit`):
#   EC2_HOST     — EC2 public IP or domain
#   EC2_USER     — SSH user (e.g. ubuntu)
#   EC2_SSH_KEY  — private key with access to the host
# Optional (only if the host isn't already logged in to GHCR):
#   GHCR_USER, GHCR_TOKEN — GitHub username + PAT with read:packages

on:
  workflow_call:
    inputs:
      service:
        type: string
        required: true
        description: 'Compose service / container name to deploy (e.g. medical-user-management)'
      compose-file:
        type: string
        required: false
        default: 'docker-compose.prod.yml'
        description: 'Compose file on the host, relative to /opt/medical-platform'
      deploy-dir:
        type: string
        required: false
        default: '/opt/medical-platform'
        description: 'Deploy directory on the host'

jobs:
  deploy:
    name: Deploy ${{ inputs.service }}
    runs-on: ubuntu-latest
    # Only deploy real merges to the default branch — never PRs.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd "${{ inputs.deploy-dir }}"
            SERVICE="${{ inputs.service }}"
            COMPOSE="docker compose -f ${{ inputs.compose-file }}"

            # Optional GHCR login (private images). The host is usually already
            # logged in, so this is a no-op unless the secrets are provided.
            if [ -n "${{ secrets.GHCR_TOKEN }}" ]; then
              echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USER }}" --password-stdin
            fi

            echo "=== Pulling $SERVICE ==="
            $COMPOSE pull "$SERVICE"

            echo "=== Recreating $SERVICE (no deps) ==="
            $COMPOSE up -d --no-deps --force-recreate "$SERVICE"

            docker image prune -f

            echo "=== Waiting for $SERVICE to be healthy ==="
            for i in $(seq 1 30); do
              status=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$SERVICE" 2>/dev/null || echo missing)
              echo "  [$i/30] $SERVICE: $status"
              if [ "$status" = "healthy" ]; then
                echo "Deploy OK — $SERVICE is healthy"
                exit 0
              fi
              if [ "$status" = "none" ]; then
                running=$(docker inspect --format '{{.State.Running}}' "$SERVICE" 2>/dev/null || echo false)
                if [ "$running" = "true" ]; then
                  echo "Deploy OK — $SERVICE is running (no healthcheck defined)"
                  exit 0
                fi
              fi
              sleep 10
            done

            echo "ERROR: $SERVICE did not become healthy within ~5m"
            docker logs --tail 80 "$SERVICE" 2>&1 || true
            exit 1
